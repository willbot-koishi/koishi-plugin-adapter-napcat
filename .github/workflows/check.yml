name: Check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
      - name: Install
        run: yarn
      - name: Lint
        run: yarn lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
      - name: Install
        run: yarn
      - name: Check types
        run: yarn build:type
